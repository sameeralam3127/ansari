services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ansari
      POSTGRES_PASSWORD: ansari
      POSTGRES_DB: ansari
    ports:
      - "5432:5432"
    volumes:
      - ansari-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansari"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANSARI_DATABASE_URL: postgresql+psycopg://ansari:ansari@db:5432/ansari
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn ansari.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  ansari-db:
