[project]
name = "ansari"
version = "0.1.0"
description = "Self-hosted, open-source developer delivery platform: CI/CD orchestration, GitOps deployment, and observability for Kubernetes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sameer Alam" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.13",
  "jinja2>=3.1",
  "structlog>=24.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
ansari = "ansari.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ansari"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"] # FastAPI's Depends() default-argument pattern is idiomatic

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "I001"] # autogenerated, not hand-formatted

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/ansari"]
