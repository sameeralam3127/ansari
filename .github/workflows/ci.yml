name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ansari
          POSTGRES_PASSWORD: ansari
          POSTGRES_DB: ansari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ansari"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      ANSARI_DATABASE_URL: postgresql+psycopg://ansari:ansari@localhost:5432/ansari
      ANSARI_TEST_DATABASE_URL: postgresql+psycopg://ansari:ansari@localhost:5432/ansari_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Migrate
        run: uv run alembic upgrade head

      # Fails when the models and the migrations have diverged -- the gap
      # that let a model change ship without a migration.
      - name: Check for missing migrations
        run: uv run alembic check

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  # Scaffolds each template and runs its real tools against the output, so a
  # template that renders but wouldn't validate fails here, not in a user's repo.
  template-smoke:
    runs-on: ubuntu-latest
    env:
      # terraform init downloads the provider; validate the default one here.
      ANSARI_TERRAFORM_VALIDATE: aws
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: hashicorp/setup-terraform@v4
        with:
          # The wrapper rewrites stdout, which the tests read.
          terraform_wrapper: false

      - run: uv sync --extra dev

      # ansible-lint, plus the yamllint and ansible-playbook it depends on, as
      # isolated tools rather than project dependencies.
      - name: Install Ansible linters
        run: uv tool install ansible-lint --with-executables-from yamllint,ansible-core

      - name: Generated templates against their real tools
        run: >-
          uv run pytest -rs
          tests/scaffold/test_terraform_module.py
          tests/scaffold/test_ansible_role.py
          tests/scaffold/test_attach.py

  build-and-scan:
    needs: lint-type-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ansari-api:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ansari-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
