<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ANSARI — new tools coming soon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1512">
        <animate attributeName="stop-color" values="#0F1512;#14231C;#0F1512" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#14201C">
        <animate attributeName="stop-color" values="#14201C;#1F7A5C;#14201C" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FD9A6" stop-opacity="0" />
      <stop offset="50%" stop-color="#4FD9A6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4FD9A6" stop-opacity="0" />
    </linearGradient>
    <clipPath id="card">
      <rect width="1200" height="300" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)" />

    <rect x="-320" y="0" width="320" height="300" fill="url(#sweep)">
      <animate attributeName="x" values="-320;1200" dur="7s" repeatCount="indefinite" />
    </rect>

    <rect width="1200" height="300" rx="20" fill="none" stroke="#24312B" stroke-width="1" />

    <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="2" fill="#EAF2EC">ANSARI</text>

    <text x="600" y="190" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#4FD9A6">NEW TOOLS COMING SOON<tspan>_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite" /></tspan></text>

    <rect x="0" y="296" width="1200" height="4" fill="#1F7A5C" opacity="0.5" />
  </g>
</svg>
